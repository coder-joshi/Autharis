services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: autharis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: autharis
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autharis -d autharis"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata: